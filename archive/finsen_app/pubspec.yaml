name: finsen_app
description: Finsen Riter Limited Store Management System
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  web_socket_channel: ^2.4.5
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.1+2
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  open_file: ^3.3.2
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  gap: ^3.0.1
  another_flushbar: ^1.12.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
